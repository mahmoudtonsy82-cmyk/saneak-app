<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تطبيق صانعك - المرحلة الثانية</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
      line-height: 1.7;
    }
    .box {
      max-width: 720px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
    }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">المرحلة الثانية — قيد التطوير</div>
    <h1>تطبيق صانعك (Saneak App)</h1>
    <p>تم إنشاء المستودع وتجهيز نقطة البداية لتطبيق صانعك على GitHub.</p>
  </div>
</body>
</html>
