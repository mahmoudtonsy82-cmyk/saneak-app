<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانعك App</title>
  <style>
    :root {
      --primary: #f0f7f0;
      --accent: #ff9900;
      --bg: #fdfaf6;
      --cards: #ffffff;
      --text: #0f172a;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1.2rem;
      color: #475569;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: bold;
      padding: 1rem 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>صانعك</h1>
    <p>نحول فكرتك إلى منتج جاهز</p>
    <a href="https://wa.me/201000000000" target="_blank" rel="noopener noreferrer" class="btn">ابدأ طلبك مباشرة</a>
  </div>
</body>
</html>
