<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانعك App</title>
    <style>
        :root {
            --primary: #f0f7f0;
            --accent: #ff9900;
            --bg: #fdfaf6;
            --cards: #ffffff;
            --text: #0f172a;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            margin: 0;
            padding: 50px;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>صانعك</h1>
    <p>نحول فكرتك إلى منتج جاهز</p>
    <a href="#order" class="btn">ابدأ طلبك مباشرة</a>
</body>
</html>
